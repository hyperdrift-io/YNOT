name: YNOT capability request
description: Describe a job YNOT could help complete
title: "[Capability] "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to complete?
      description: Describe the outcome, current approach and constraint that makes it difficult. Keep private customer details out of the report.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and evidence
      description: Explain how the change would help and how you would check that it works. Include a small example if available.
