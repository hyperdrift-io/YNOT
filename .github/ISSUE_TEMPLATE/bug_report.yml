name: YNOT bug report
description: Report a reproducible problem in YNOT
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report problems with this YNOT checkout here. Remove credentials and private customer data from examples and logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behaviour and the observed result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the code or commands and any non-sensitive fixture needed to reproduce it. Distinguish scripted responses from live provider calls.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: YNOT revision and environment
      description: Include the commit or ynot-ai version, Python version and operating system.
    validations:
      required: true
